# Build every demo image, push it to GHCR, then roll the Hetzner box forward.
#
# Repository secrets:
#   DEPLOY_HOST         server IP or hostname
#   DEPLOY_USER         SSH user (in the docker group)
#   DEPLOY_SSH_KEY      private key for that user (ed25519, deploy-only)
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>`, so the host key is pinned
#   LAUNDRYFLOW_DEPLOY_KEY  private half of a read-only deploy key on Rhaqim/laundryflow
#                           (private), so its image can be built here. One repo,
#                           no expiry, not tied to a personal account.
# Repository variables (optional):
#   PLATFORM            linux/amd64 (default) or linux/arm64 for Hetzner CAX machines
#   DEPLOY_DIR          /opt/demo (default)
#   DEMO_DOMAIN         api.rhaqim.com (default), used by the smoke test
#   TBH_DOMAIN          api.thebinaryhouse.studio (default), used by the smoke test
#   LAUNDRYFLOW_REF     branch, tag or sha of laundryflow to build (default main)

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/demo

jobs:
  build:
    # Build arm64 natively on GitHub's arm runners rather than under QEMU; a
    # Rust release build under emulation takes most of an hour.
    runs-on: ${{ vars.PLATFORM == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: gateway, context: gateway, dockerfile: gateway/Dockerfile, cmd: "" }
          - { name: hub, context: services/go, dockerfile: services/go/Dockerfile, cmd: hub }
          - { name: buckt, context: services/go, dockerfile: services/go/Dockerfile, cmd: buckt }
          - { name: loom, context: services/go, dockerfile: services/go/Dockerfile, cmd: loom }
          - { name: studio, context: services/go, dockerfile: services/go/Dockerfile, cmd: studio }
          - { name: ussd, context: services/ussd, dockerfile: services/ussd/Dockerfile, cmd: "" }
          - { name: laundryflow, context: laundryflow, dockerfile: laundryflow/Dockerfile, cmd: "", repo: Rhaqim/laundryflow }
    steps:
      - uses: actions/checkout@v4

      # A service whose code lives in another (private) repository.
      - uses: actions/checkout@v4
        if: matrix.repo
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ vars.LAUNDRYFLOW_REF || 'main' }}
          ssh-key: ${{ secrets.LAUNDRYFLOW_DEPLOY_KEY }}
          path: ${{ matrix.context }}

      - name: Lowercase registry
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ vars.PLATFORM || 'linux/amd64' }}
          build-args: ${{ matrix.cmd && format('CMD={0}', matrix.cmd) || '' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/demo' }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase registry
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host demo
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
          EOF

      - name: Ship compose file and Makefile
        run: |
          ssh demo "mkdir -p '$DEPLOY_DIR/certs'"
          scp docker-compose.yml Makefile "demo:$DEPLOY_DIR/"

      - name: Check certificates
        run: |
          # Caddy refuses to start without every site's certificate, which
          # would take both API hosts down. Stop here instead.
          for f in origin.pem origin-key.pem tbh-origin.pem tbh-origin-key.pem; do
            ssh demo "test -s '$DEPLOY_DIR/certs/$f'" || { echo "::error::$DEPLOY_DIR/certs/$f is missing on the server (see README, Server setup)"; exit 1; }
          done

      - name: Pull and restart
        run: |
          # The job's token can read this repo's packages; it expires with the
          # job, so nothing long-lived is left on the server.
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh demo "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh demo "cd '$DEPLOY_DIR' && export REGISTRY='$REGISTRY' TAG='${{ github.sha }}' \
            && docker compose pull --quiet \
            && docker compose up -d --remove-orphans \
            && docker image prune -f >/dev/null \
            && docker logout ghcr.io >/dev/null"

      - name: Smoke test
        env:
          DOMAIN: ${{ vars.DEMO_DOMAIN || 'api.rhaqim.com' }}
          TBH: ${{ vars.TBH_DOMAIN || 'api.thebinaryhouse.studio' }}
        run: |
          # Hit Caddy on the box itself (-k: the origin cert is only trusted by Cloudflare).
          for url in $DOMAIN/api/health $DOMAIN/api/ussd/health $DOMAIN/api/buckt/health $DOMAIN/api/loom/health $DOMAIN/api/studio/health $TBH/api/laundryflow/health; do
            host="${url%%/*}"; path="${url#*/}"
            ok=""
            for i in $(seq 1 15); do
              if ssh demo "curl -fsSk --resolve $host:443:127.0.0.1 https://$url" >/dev/null 2>&1; then ok=1; break; fi
              sleep 4
            done
            [ -n "$ok" ] || { echo "::error::https://$url did not come up"; ssh demo "cd '$DEPLOY_DIR' && docker compose ps && docker compose logs --tail 40"; exit 1; }
            echo "✓ $url"
          done
