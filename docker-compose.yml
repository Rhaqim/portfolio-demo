# The demo stack. CI builds and pushes every image; the server only pulls.
#   TAG=<git sha> docker compose pull && TAG=<git sha> docker compose up -d
# Local: see docker-compose.local.yml.

name: demo

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-shared-db: &shared-db
  DEMO_DB: /data/demo.db

services:
  gateway:
    <<: *service
    image: ${REGISTRY:-ghcr.io/rhaqim/demo}/gateway:${TAG:-latest}
    build: { context: gateway }
    ports: ["80:80", "443:443"]
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:-api.rhaqim.com}
      # The Binary House's own API host, with its own cert (certs/tbh-origin*.pem).
      TBH_DOMAIN: ${TBH_DOMAIN:-api.thebinaryhouse.studio}
      # Regex of page origins allowed to call the API with the visitor cookie.
      CORS_ORIGINS: ${CORS_ORIGINS:-^https://(www\.)?rhaqim\.com$}
      TBH_CORS_ORIGINS: ${TBH_CORS_ORIGINS:-^https://(www\.)?thebinaryhouse\.studio$}
    volumes:
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [hub, ussd, buckt, loom, laundryflow]
    mem_limit: 128m

  hub:
    <<: *service
    image: ${REGISTRY:-ghcr.io/rhaqim/demo}/hub:${TAG:-latest}
    build: { context: services/go, args: { CMD: hub } }
    environment:
      <<: *shared-db
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      FEEDBACK_WEBHOOK_URL: ${FEEDBACK_WEBHOOK_URL:-}
    volumes: [demo_data:/data]
    mem_limit: 64m

  buckt:
    <<: *service
    image: ${REGISTRY:-ghcr.io/rhaqim/demo}/buckt:${TAG:-latest}
    build: { context: services/go, args: { CMD: buckt } }
    environment:
      <<: *shared-db
      BUCKT_MEDIA_DIR: /data/buckt-media
    volumes: [demo_data:/data]
    mem_limit: 384m

  loom:
    <<: *service
    image: ${REGISTRY:-ghcr.io/rhaqim/demo}/loom:${TAG:-latest}
    build: { context: services/go, args: { CMD: loom } }
    environment:
      <<: *shared-db
      OPENAI_MODELS: ${OPENAI_MODELS:-gpt-5-mini,gpt-5}
      # Sermon captions: with a key, a visitor's first lines run on the demo's
      # own key (capped per hour and per visitor); without one, a dry run.
      CAPTIONS_ANTHROPIC_API_KEY: ${CAPTIONS_ANTHROPIC_API_KEY:-}
      CAPTIONS_MODEL: ${CAPTIONS_MODEL:-anthropic/claude-sonnet-5-5}
      CAPTIONS_LINES_PER_HOUR: ${CAPTIONS_LINES_PER_HOUR:-120}
      CAPTIONS_LINES_PER_VISITOR: ${CAPTIONS_LINES_PER_VISITOR:-30}
    volumes: [demo_data:/data]
    mem_limit: 256m

  laundryflow:
    # Served on api.thebinaryhouse.studio only. Built by CI from the private
    # Rhaqim/laundryflow repo (its own Dockerfile); the demo is the sandbox
    # binary in that image. In memory only: no volume, nothing survives a
    # restart.
    <<: *service
    image: ${REGISTRY:-ghcr.io/rhaqim/demo}/laundryflow:${TAG:-latest}
    entrypoint: [/usr/local/bin/sandbox]
    environment:
      SANDBOX_IDLE: ${LAUNDRYFLOW_IDLE:-30m}
      SANDBOX_MAX: ${LAUNDRYFLOW_MAX:-400}
      # Messages the rules cannot read are interpreted by Claude Haiku when
      # this is "on" and ANTHROPIC_API_KEY is set; capped per hour.
      SANDBOX_INTERPRET: ${LAUNDRYFLOW_INTERPRET:-off}
      SANDBOX_INTERPRET_PER_HOUR: ${LAUNDRYFLOW_INTERPRET_PER_HOUR:-600}
      ANTHROPIC_API_KEY: ${LAUNDRYFLOW_ANTHROPIC_API_KEY:-}
    mem_limit: 128m

  ussd:
    <<: *service
    image: ${REGISTRY:-ghcr.io/rhaqim/demo}/ussd:${TAG:-latest}
    build: { context: services/ussd }
    mem_limit: 128m

volumes:
  # One volume, one SQLite file (demo.db) shared by hub, buckt and loom, plus
  # buckt's media. Each service namespaces its tables: demo_*, buckt_*, loom_*.
  demo_data:
  caddy_data:
  caddy_config:
